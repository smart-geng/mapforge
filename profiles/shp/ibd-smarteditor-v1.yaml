# IBD 规格（金凤交付，smarteditor 编辑器产出）—— Profile 引擎参考实现。
# 与内置 IbdSource 硬编码读取器等价（tests/test_profile_engine.py 锁等价，防两者漂移）。
profile: ibd-smarteditor-v1
encoding: gbk                    # DBF LDID=0x57 声称 ANSI，实测 GBK（资料盘点）
units:
  length: mm                     # IBD 长度/宽度全系毫米
crs:
  declared: "WGS84(声称；.prj 自定义 WKT 无 EPSG)"
  verified: internally-consistent   # 与现网 MAP XML 逐点重合（M0 核验）；绝对校验遗留

layers:
  junction:
    file: IBD_OBJECT_INTERSECTION_SURFACE
    list_sep: ";"
    fields: {id: OBJECT_PID, name: NAME, enter_roads: ENTER_ROAD, leave_roads: LEAVE_ROAD}
  road:
    file: IBD_ROADLINK
    fields: {id: LINK_PID, name: ROADNAME, lane_count: LANE_NUM}
  road_center:
    file: IBD_ROADCENTER
    fields: {road: LINK_PID, is_junction_interior: IS_JUNC}
  lane:
    file: IBD_LANE_LINK
    geometry: field              # 路线 A：本层自带车道中心线
    width_from: [field, boundaries, spacing, default]
    default_width_m: 3.5
    fields:
      id: LANE_PID
      road: LINK_PID
      seq: SEQ_NUM
      width: WIDTH
      width_start: S_WIDTH
      width_end: E_WIDTH
      lane_type: LANE_TYPE
      max_speed: MAX_SPEED
  lane_merge:
    file: IBD_LANE_LINK_MERGE
    fields: {id: LANE_PID, road: LINK_PID, seq: SEQ_NUM, width: WIDTH}
  topo:
    file: IBD_LANE_TOPO_DETAIL
    fields: {from: IN_PID, to: OUT_PID}
  boundary:
    file: IBD_LANE_BOUNDARY
    fields: {id: BORDER_PID}
  lane_boundary_rel:
    file: IBD_LANE_BOUNDARY_REL
    side_values: {left: 1, right: 2}    # SIDE=1 左 / 2 右（金凤实测边界横距≈WIDTH 验证）
    fields: {lane: LANE_PID, boundary: BORDER_PID, side: SIDE}
