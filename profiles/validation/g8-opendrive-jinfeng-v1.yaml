  note: 现有14样本均有历史观察；locked_validation仅防本轮调参，不构成盲测
  calibration_nodes:
  - node3
  - node4
  - NODE5
  - node13
  locked_validation_nodes:
  - node16
  - node17
  - node18
  quantize_m: 0.05
  margin_m: 0.1
  engineering_ceiling:
    median_max_m: 0.6
    p95_max_m: 1.5
    max_max_m: 3.0
    endpoint_max_m: 1.5
    stopline_delta_max_m: 1.5
    coverage_min: 0.95
  promotion:
    method: unchanged-pre-registered-limits
    threshold_fitting: false
    engineering_ceiling_relaxation: false
