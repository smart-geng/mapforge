[project]
name = "mapforge"
version = "0.0.1.dev0"
description = "地图格式转换工厂：OpenDRIVE / 车道级 SHP / V2X MAP 离线互转"
readme = "README.md"
license = { file = "LICENSE" }
# 3.12 起 sum() 改用补偿求和，浮点末位与归档环境不同（实测把 1.0 算成 1.0000000000000002，
# 让 extrapolate=False 的 B 样条返回 NaN）。在冻结证据仍需重放期间固定 3.11。
requires-python = ">=3.11,<3.12"
# 依赖版本按 2026-09-15 归档环境（archives/mapforge-development-20260915/environment.json）逐项锁定。
# 升级数值栈需要单独做评分板对比，不能顺手升级。
dependencies = [
    "numpy==2.2.6",
    "scipy==1.15.3",
    "lxml==6.1.1",
    "pyshp==3.1.6",
    "pyproj==3.7.1",
    "shapely==2.1.2",
    "pyclothoids==0.2.0",
    "pycrate==0.8.1",
    "typer==0.27.1",
    "PyYAML==6.0.3",
]

[dependency-groups]
# 本地修形台：scripts/serve_repair_workbench.py
web = ["fastapi==0.141.1", "uvicorn==0.53.0"]
# 研究脚本与共同求解（OSQP、Clarabel 均为 Apache-2.0）、出图
research = ["osqp==1.1.3", "clarabel==0.11.1", "matplotlib==3.10.9", "pillow==12.3.0"]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.uv]
# 仓库根目录直接运行（tests/conftest.py 负责 sys.path），不构建安装包。
package = false
default-groups = ["dev", "web", "research"]
